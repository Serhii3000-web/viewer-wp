<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/style.css">
        <title>Veiwer WP</title>
    </head>
    <body>
        <div class="wrapper">

            <div class="viewer-card">
                <h2 class="viewer-card--img-title">Chaos Space Marine</h2>

                <div class="viewer-360" data-folder="Abaddon the Despoiler" data-frames="48">
                    <canvas class="viewer-canvas"></canvas>
                </div>

                <h4 class="viewer-card--img-info">Abaddon the Despoiler</h4>
            </div>

            <div class="viewer-card">
                <h2 class="viewer-card--img-title">Chaos Space Marine</h2>

                <div class="viewer-360" data-folder="Sorcerer Lord in Terminator Armour" data-frames="12">
                    <canvas class="viewer-canvas"></canvas>
                </div>

                <h4 class="viewer-card--img-info">Sorcerer Lord in Terminator Armour</h4>
            </div>

            <div class="viewer-card">
                <h2 class="viewer-card--img-title">Chaos Space Marine</h2>

                <div class="viewer-360" data-folder="Chosen" data-frames="12">
                    <canvas class="viewer-canvas"></canvas>
                </div>

                <h4 class="viewer-card--img-info">Chosen</h4>
            </div>

            <div class="viewer-card">
                <h2 class="viewer-card--img-title">Chaos Space Marine</h2>

                <div class="viewer-360" data-folder="Chaos Terminator" data-frames="48">
                    <canvas class="viewer-canvas"></canvas>
                </div>

                <h4 class="viewer-card--img-info">Chaos Terminator</h4>
            </div>

            <div class="viewer-card">
                <h2 class="viewer-card--img-title">Chaos Space Marine</h2>

                <div class="viewer-360" data-folder="Venomcrawler" data-frames="12">
                    <canvas class="viewer-canvas"></canvas>
                </div>

                <h4 class="viewer-card--img-info">Venomcrawler</h4>
            </div>

            <div class="viewer-card">
                <h2 class="viewer-card--img-title">Chaos Space Marine</h2>

                <div class="viewer-360" data-folder="Obliterators 1" data-frames="12">
                    <canvas class="viewer-canvas"></canvas>
                </div>

                <h4 class="viewer-card--img-info">Obliterators</h4>
            </div>

            <div class="viewer-card">
                <h2 class="viewer-card--img-title">Chaos Space Marine</h2>

                <div class="viewer-360" data-folder="Obliterators 2" data-frames="12">
                    <canvas class="viewer-canvas"></canvas>
                </div>

                <h4 class="viewer-card--img-info">Obliterators</h4>
            </div>

            <div class="carousel-controls">
                <button id="prevBtn">◀</button>
                <button id="nextBtn">▶</button>
            </div>
        </div>

        <script defer src="./js/viewer360.js"></script>
        <script defer src="./js/main.js"></script>
        <!-- <script type="module" src="./js/main.js"></script> -->
    </body>
</html>
