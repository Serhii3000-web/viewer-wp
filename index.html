<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="img/favicon.png">
        <link rel="stylesheet" href="./css/style.css">
        <title>Veiwer WP</title>
    </head>
    <body>
        <div class="wrapper-slider">

            <div class="carousel">

                <div class="carousel__track">

                    <div class="viewer-card">
                        <h2 class="viewer-card__title">Chaos Space Marine</h2>

                        <div class="viewer-360" data-folder="Abaddon the Despoiler" data-frames="48">
                            <canvas class="viewer-360__canvas"></canvas>
                        </div>

                        <h4 class="viewer-card__info">Abaddon the Despoiler</h4>
                    </div>

                    <div class="viewer-card">
                        <h2 class="viewer-card__title">Chaos Space Marine</h2>

                        <div class="viewer-360" data-folder="Sorcerer Lord in Terminator Armour" data-frames="12">
                            <canvas class="viewer-360__canvas"></canvas>
                        </div>

                        <h4 class="viewer-card__info">Sorcerer Lord in Terminator Armour 23456789</h4>
                    </div>

                    <div class="viewer-card">
                        <h2 class="viewer-card__title">Chaos Space Marine</h2>

                        <div class="viewer-360" data-folder="Chosen" data-frames="12">
                            <canvas class="viewer-360__canvas"></canvas>
                        </div>

                        <h4 class="viewer-card__info">Chosen</h4>
                    </div>

                    <div class="viewer-card">
                        <h2 class="viewer-card__title">Chaos Space Marine</h2>

                        <div class="viewer-360" data-folder="Chaos Terminator" data-frames="48">
                            <canvas class="viewer-360__canvas"></canvas>
                        </div>

                        <h4 class="viewer-card__info">Chaos Terminator</h4>
                    </div>

                    <div class="viewer-card">
                        <h2 class="viewer-card__title">Chaos Space Marine</h2>

                        <div class="viewer-360" data-folder="Venomcrawler" data-frames="12">
                            <canvas class="viewer-360__canvas"></canvas>
                        </div>

                        <h4 class="viewer-card__info">Venomcrawler</h4>
                    </div>

                    <div class="viewer-card">
                        <h2 class="viewer-card__title">Chaos Space Marine</h2>

                        <div class="viewer-360" data-folder="Obliterators 1" data-frames="12">
                            <canvas class="viewer-360__canvas"></canvas>
                        </div>

                        <h4 class="viewer-card__info">Obliterators</h4>
                    </div>

                    <div class="viewer-card">
                        <h2 class="viewer-card__title">Chaos Space Marine</h2>

                        <div class="viewer-360" data-folder="Obliterators 2" data-frames="12">
                            <canvas class="viewer-360__canvas"></canvas>
                        </div>

                        <h4 class="viewer-card__info">Obliterators</h4>
                    </div>

                </div>

                <button class="prevBtn-Below">◀</button>
                <button class="nextBtn-Below">▶</button>

                <div class="carousel__buttons-bottom">
                    <button class="carousel__button-bottom--nextBtn">◀</button>
                    <button class="prevBtn-Bottom carousel__button-bottom--prevBtn">▶</button>
                </div>

            </div>
            
        </div>

        <script defer src="./js/viewer360.js"></script>
        <script defer src="./js/main.js"></script>
        <!-- <script type="module" src="./js/main.js"></script> -->
    </body>
</html>
