<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="img/favicon.png">
        <link rel="stylesheet" href="./css/hud-wh.css">
        <link rel="stylesheet" href="./css/style.css">

        <title>Slider WH</title>
    </head>
    <body>

        <!-- внешний сайт -->
        <div class="page-layout">
            <!-- контент темы -->
            <div class="wp-content">

<!-- ================================================================================ -->
                <!-- твой плагин -->
                <div class="wrapper-slider">
                    <!-- твоя сцена -->
                    <div class="carousel">

                        <div class="carousel__panel carousel__panel--left"></div>
                        <div class="carousel__panel carousel__panel--right"></div>

                        <!-- HEADER HUD -->
                        <div class="hud" data-layout="header" data-faction="chaos"></div>
                        <!-- ------------------ -->

                        <div class="carousel__track">

                            <div class="viewer-card">
                                <div class="viewer-card__panel viewer-card__panel--left"></div>
                                <div class="viewer-card__panel viewer-card__panel--right"></div>

                                <h2 class="viewer-card__title">Chaos Space Marine</h2>

                                <div class="viewer-360" data-folder="Abaddon the Despoiler" data-frames="48">
                                    <canvas class="viewer-360__canvas"></canvas>
                                </div>

                                <h4 class="viewer-card__info">Abaddon the Despoiler</h4>
                            </div>

                            <div class="viewer-card">
                                <div class="viewer-card__panel viewer-card__panel--left"></div>
                                <div class="viewer-card__panel viewer-card__panel--right"></div>

                                <h2 class="viewer-card__title">Chaos Space Marine</h2>

                                <div class="viewer-360" data-folder="Sorcerer Lord in Terminator Armour" data-frames="12">
                                    <canvas class="viewer-360__canvas"></canvas>
                                </div>

                                <h4 class="viewer-card__info">Sorcerer Lord in Terminator Armour</h4>
                            </div>

                            <div class="viewer-card">
                                <h2 class="viewer-card__title">Chaos Space Marine</h2>

                                <div class="viewer-360" data-folder="Chosen" data-frames="12">
                                    <canvas class="viewer-360__canvas"></canvas>
                                </div>

                                <h4 class="viewer-card__info">Chosen</h4>
                            </div>

                            <div class="viewer-card">
                                <h2 class="viewer-card__title">Chaos Space Marine</h2>

                                <div class="viewer-360" data-folder="Chaos Terminator" data-frames="48">
                                    <canvas class="viewer-360__canvas"></canvas>
                                </div>

                                <h4 class="viewer-card__info">Chaos Terminator</h4>
                            </div>

                            <div class="viewer-card">
                                <h2 class="viewer-card__title">Chaos Space Marine</h2>

                                <div class="viewer-360" data-folder="Venomcrawler" data-frames="12">
                                    <canvas class="viewer-360__canvas"></canvas>
                                </div>

                                <h4 class="viewer-card__info">Venomcrawler</h4>
                            </div>

                            <div class="viewer-card">
                                <h2 class="viewer-card__title">Chaos Space Marine</h2>

                                <div class="viewer-360" data-folder="Obliterators 1" data-frames="12">
                                    <canvas class="viewer-360__canvas"></canvas>
                                </div>

                                <h4 class="viewer-card__info">Obliterators</h4>
                            </div>

                            <div class="viewer-card">
                                <h2 class="viewer-card__title">Chaos Space Marine</h2>

                                <div class="viewer-360" data-folder="Obliterators 2" data-frames="12">
                                    <canvas class="viewer-360__canvas"></canvas>
                                </div>

                                <h4 class="viewer-card__info">Obliterators</h4>
                            </div>

                        </div>

                        <button class="carousel__button-below--prevBtn">▶</button>
                        <button class="carousel__button-below--nextBtn">◀</button>

                        <!-- FOOTER HUD -->
                        <div class="hud" data-layout="footer" data-faction="chaos"></div>
                        <!-- ------------------ -->

                    </div>
                </div>
<!-- ================================================================================ -->

            </div>
        </div>
        <script src="./js/debug.js"></script>

        <script src="./js/core/CanvasBase.js"></script>
        <script src="./js/ConfigHud/config-hud.js"></script>
        <script src="./js/ClassHud/HudManagerCSS.js"></script>
        <script src="./js/ClassHud/HudWH.js"></script>
        <script src="./js/ClassViewer360/Viewer360.js"></script>
        <script src="./js/carousel/CarouselWH.js"></script>
        <script src="./js/hud.js"></script>
        <script src="./js/main.js"></script>
        <!-- <script type="module" src="./js/main.js"></script> -->
    </body>
</html>
